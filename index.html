<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Stream Player</title>
<style>
:root{
  --bg:#12151b; --panel:#1b2029; --panel2:#232a35; --text:#e6e9ef;
  --muted:#9aa4b2; --accent:#4da3ff; --green:#22c55e; --red:#ef4444;
  --border:#2c3542; --shadow:rgba(0,0,0,.4);
  --wiki-bg:#1b2029; --wiki-border:#3a4552; --wiki-header:#232a35;
  --wiki-row-alt:#1f2630; --wiki-link:#7bb8ff;
  --star:#facc15;
  --sep1-bg:#1e3a5f; --sep1-fg:#9ecbff; --sep1-bd:#2d5f9a;
  --sep2-bg:#3a2f1e; --sep2-fg:#f0d08a; --sep2-bd:#6b5528;
  --sep3-bg:#1e3a2f; --sep3-fg:#9ee6b8; --sep3-bd:#2d6b4a;
  --sep4-bg:#3a1e3a; --sep4-fg:#e0a8e0; --sep4-bd:#6b2d6b;
  --sep5-bg:#3a1e22; --sep5-fg:#f0a8b0; --sep5-bd:#6b2d35;
  --sep6-bg:#1e2f3a; --sep6-fg:#8ad0e6; --sep6-bd:#2d5566;
}
html[data-theme="light"]{
  --bg:#f4f6fb; --panel:#ffffff; --panel2:#eef1f7; --text:#1a1f29;
  --muted:#5d6673; --accent:#2563eb; --green:#16a34a; --red:#dc2626;
  --border:#d6dbe4; --shadow:rgba(0,0,0,.12);
  --wiki-bg:#ffffff; --wiki-border:#a2a9b1; --wiki-header:#eaecf0;
  --wiki-row-alt:#f8f9fa; --wiki-link:#3366cc;
  --star:#d97706;
  --sep1-bg:#dbeafe; --sep1-fg:#1e40af; --sep1-bd:#93c5fd;
  --sep2-bg:#fef3c7; --sep2-fg:#92400e; --sep2-bd:#fcd34d;
  --sep3-bg:#dcfce7; --sep3-fg:#166534; --sep3-bd:#86efac;
  --sep4-bg:#f3e8ff; --sep4-fg:#6b21a8; --sep4-bd:#d8b4fe;
  --sep5-bg:#ffe4e6; --sep5-fg:#9f1239; --sep5-bd:#fda4af;
  --sep6-bg:#e0f2fe; --sep6-fg:#075985; --sep6-bd:#7dd3fc;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{
  margin:0; font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--text); padding:12px;
  transition:background .2s,color .2s;
  font-size:14px; font-weight:400;
  -webkit-text-size-adjust:100%;
}
.header-bar{
  display:flex; align-items:center; gap:10px; margin:0 0 10px 0;
  position:sticky; top:0; z-index:40;
  background:var(--bg); padding:8px 0;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
  border-bottom:1px solid var(--border);
}
html[data-theme="light"] .header-bar{ box-shadow:0 2px 8px rgba(0,0,0,.08); }
.header-bar h2.title{font-size:20px; font-weight:700; margin:0; flex:1; text-align:center; padding:0;}
.hamburger{
  background:transparent; border:1px solid var(--border);
  border-radius:8px; padding:6px 9px; cursor:pointer;
  display:flex; flex-direction:column; gap:4px; flex:0 0 auto;
}
.hamburger span{display:block; width:20px; height:2px; background:var(--text); border-radius:2px;}
.hamburger:hover{border-color:var(--accent)}
.hamburger:hover span{background:var(--accent)}
.menu-overlay{position:fixed; inset:0; background:var(--shadow); display:none; z-index:60;}
.menu-overlay.open{display:block}
.side-menu{
  position:fixed; top:0; left:0; height:100%; width:270px; max-width:82vw;
  background:var(--panel); border-right:1px solid var(--border);
  z-index:61; padding:14px; display:flex; flex-direction:column; gap:6px;
  transform:translateX(-100%); transition:transform .22s ease; overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.side-menu.open{transform:translateX(0)}
.side-menu .menu-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
.side-menu .menu-head .menu-title{font-weight:700;font-size:16px}
.side-menu .close-x{background:transparent; border:1px solid var(--border); border-radius:8px;
  width:32px; height:32px; font-size:18px; line-height:1; cursor:pointer; color:var(--text);}
.side-menu .close-x:hover{border-color:var(--accent);color:var(--accent)}
.side-menu button.menu-item{width:100%; text-align:left; background:transparent;
  border:1px solid transparent; padding:11px 12px; border-radius:8px; color:var(--text); font-size:14px; cursor:pointer;}
.side-menu button.menu-item:hover{background:var(--panel2);border-color:var(--border)}
.side-menu button.menu-item.danger{color:var(--red)}
.side-menu button.menu-item.danger:hover{background:rgba(239,68,68,.12)}
.side-menu button.menu-item.active{background:rgba(77,163,255,.15); border-color:var(--accent); color:var(--accent); font-weight:600;}
.side-menu hr.menu-hr{border:none; border-top:1px solid var(--border); margin:6px 0;}

.player{background:var(--panel); border:1px solid var(--border); border-radius:12px;
  padding:12px; margin-bottom:12px; width:100%; max-width:100%;}
.player .top-row{display:flex; flex-direction:column; gap:10px; align-items:stretch;}
.player .top-row img {
  width: 100%; height: auto; max-height: 200px;
  object-fit: contain; background: #000;
  border-radius: 10px; border: 1px solid var(--border);
  display: block; margin: 0 auto;
}
.player .head{display:flex; flex-direction:column; gap:6px}
.player .head .name-wrap{display:flex; align-items:center; justify-content:center; gap:6px;}
.player .head .name{font-weight:800; font-size:22px; line-height:1.25; text-align:center; word-break:break-word;}
.player .head .sub{display:flex; flex-direction:column; gap:2px;}
.player .head .sub .info-line{color:var(--muted); font-size:14px; line-height:1.4;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.player .head .sub .info-line .label{color:var(--text); font-weight:600; margin-right:4px;}
.player .badges{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px;}
.player .badges .badge{font-size:14px; padding:9px 12px; border-radius:8px;
  background:var(--panel2); color:var(--text); border:1px solid var(--border);
  font-weight:400; flex:1 1 0; text-align:center; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.player .badges .badge.online{background:rgba(34,197,94,.15); color:var(--green); border-color:rgba(34,197,94,.4);}
.player .badges .badge.offline{background:rgba(239,68,68,.15); color:var(--red); border-color:rgba(239,68,68,.4);}
.player .badges .badge.type{background:rgba(77,163,255,.15); color:var(--accent); border-color:rgba(77,163,255,.4);}

.fav-btn{background:none; border:none; padding:0 4px; font-size:22px; line-height:1; cursor:pointer;
  color:var(--muted); transition:color .15s, transform .15s; -webkit-tap-highlight-color:transparent;}
.fav-btn:hover{ color:var(--star); transform:scale(1.15); }
.fav-btn.on{ color:var(--star); }
.fav-btn.on:hover{ color:var(--star); }
.player .fav-btn{ font-size:24px; }
table.wikitable .fav-btn{ font-size:18px; vertical-align:middle; margin-right:4px; }

.player .now{font-size:14px; margin-top:10px; min-height:1.4em; line-height:1.4;}
.player .now .np-label{ font-weight:700; color:var(--accent); }
.player .now .np-title{ font-style:italic; color:var(--text); }
.player .now .np-none{ font-weight:600; color:var(--red); }
.player audio{width:100%;margin-top:8px}
.player .under-buttons{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
.player .under-buttons .btn-row{display:flex; gap:8px; width:100%;}
.player .under-buttons a{
  flex:1 1 0; width:100%; text-align:center; font-size:14px;padding:9px 12px;border-radius:8px;
  background:var(--panel2);color:var(--text); border:1px solid var(--border);
  text-decoration:none;font-weight:400; cursor:pointer;}
.player .under-buttons a:hover{border-color:var(--accent);color:var(--accent)}
.player .under-buttons a.missing{color:var(--red);border-color:rgba(239,68,68,.4);
  background:rgba(239,68,68,.1); cursor:not-allowed;}

.player .streams{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
  gap:8px;
  width:100%;
}
.player .under-buttons .streams button{
  width:100%;
  text-align:center;
  font-size:13px;
  padding:9px 8px;
  border-radius:8px;
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border);
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.player .under-buttons .streams button:hover{border-color:var(--accent);color:var(--accent)}
.player .streams button.active,
.player .streams button.active:hover,
.player .streams button.active:focus{
  background:var(--accent) !important; color:#fff !important;
  border-color:var(--accent) !important; -webkit-text-fill-color:#fff !important;
  opacity:1 !important;}
@media (hover:none){
  .player .under-buttons .streams button:hover{border-color:var(--border);color:var(--text)}
  .player .streams button.active:hover,
  .player .streams button.active:focus{
    background:var(--accent) !important;color:#fff !important;
    border-color:var(--accent) !important; -webkit-text-fill-color:#fff !important;}
}
.player .btn-edit-full{display:block; width:100%; text-align:center; font-size:14px;padding:9px 12px;
  border-radius:8px; background:var(--panel2);color:var(--text); border:1px solid var(--border);
  cursor:pointer; font-weight:400;}
.player .btn-edit-full:hover{border-color:var(--accent);color:var(--accent)}

.search-section{margin:4px 0 12px}
.search-section h3{font-size:16px;font-weight:700;margin:0 0 6px 0;}
.search-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search-wrap{position:relative; flex:1; min-width:150px;}
.search{width:100%; padding:9px 36px 9px 9px; border-radius:8px; border:1px solid var(--border);
  background:var(--panel); color:var(--text); font-size:14px;}
.search-clear{position:absolute; top:50%; right:6px; transform:translateY(-50%);
  width:24px; height:24px; border-radius:50%; border:none; background:transparent;
  color:var(--muted); font-size:16px; line-height:1; cursor:pointer; display:none;
  align-items:center; justify-content:center; padding:0; -webkit-tap-highlight-color:transparent;}
.search-clear.visible{ display:flex; }
.search-clear:hover{color:var(--red); background:rgba(239,68,68,.12);}
.search-info{font-size:14px;color:var(--muted);margin-top:6px;min-height:1em}
.search-info b{color:var(--accent)}

.filter-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
.filter-row button{flex:1 1 0; min-width:120px; padding:9px 14px; border-radius:8px;
  font-size:14px; background:var(--panel); color:var(--text); border:1px solid var(--border);
  cursor:pointer; white-space:nowrap;}
.filter-row button:hover{border-color:var(--accent);color:var(--accent)}
#btn-fav-filter.on{background:rgba(250,204,21,.15); color:var(--star); border-color:var(--star); font-weight:600;}
#btn-all-stations.on{background:rgba(77,163,255,.15); color:var(--accent); border-color:var(--accent); font-weight:600;}

button{background:var(--panel2);color:var(--text);border:1px solid var(--border);
  border-radius:8px;padding:8px 12px;cursor:pointer;font-size:14px;}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.danger{background:rgba(239,68,68,.15);color:var(--red);border-color:rgba(239,68,68,.4)}

.table-wrap{overflow-x:auto; border:1px solid var(--wiki-border); border-radius:2px;
  -webkit-overflow-scrolling:touch; display:none; background:var(--wiki-bg); margin-bottom:12px;}
.table-wrap.visible{display:block;}

table.wikitable{border-collapse:collapse; width:100%; font-size:13px;
  font-family:system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color:var(--text); background:var(--wiki-bg); border:1px solid var(--wiki-border);}

table.wikitable > thead > tr > th{background:var(--wiki-header); color:var(--text);
  border:1px solid var(--wiki-border); padding:8px 10px; text-align:left;
  font-weight:700; font-size:13px; vertical-align:top;}
table.wikitable > thead > tr > th:first-child{width:28%; min-width:140px;}
table.wikitable > thead > tr > th:last-child{width:72%;}

table.wikitable > tbody > tr > td{background:var(--wiki-bg); border:1px solid var(--wiki-border);
  padding:7px 10px; vertical-align:top; line-height:1.4; font-size:13px;}

table.wikitable > tbody > tr > td:first-child{font-weight:600; color:var(--text);
  background:var(--wiki-header); white-space:nowrap;}

table.wikitable > tbody > tr > td:last-child{color:var(--text);}

table.wikitable > tbody > tr:nth-child(even) > td:last-child{background:var(--wiki-row-alt);}

table.wikitable > tbody > tr:hover > td:last-child{background:rgba(77,163,255,.08);}

table.wikitable > tbody > tr.station-group-start > td{border-top:2px solid var(--accent);}

table.wikitable a{color:var(--wiki-link); text-decoration:none;}
table.wikitable a:hover{text-decoration:underline;}

table.wikitable mark{background:#facc15; color:#111; padding:0 2px; border-radius:2px; font-weight:600;}
html[data-theme="light"] table.wikitable mark{background:#fde047; color:#111;}

table.wikitable .call-cell{cursor:pointer;}
table.wikitable .call-cell strong{font-size:15px; font-weight:700; white-space:nowrap;}
table.wikitable .call-cell:hover strong{color:var(--accent); text-decoration:underline;}

table.wikitable .freq-cell .freq-text{font-size:14px; font-weight:600;}

.status-dot{display:inline-block; width:9px; height:9px; border-radius:50%;
  margin-right:6px; vertical-align:middle;}
.dot-on{background:var(--green)}
.dot-off{background:var(--red)}
.dot-unknown{background:var(--muted)}

table.wikitable .url-list{display:flex; flex-direction:column; gap:4px;}
table.wikitable .url-list a{word-break:break-all; font-size:12px;}

table.wikitable .actions{display:flex; gap:6px; flex-wrap:wrap;}
table.wikitable .actions button{padding:4px 9px; font-size:12px; border-radius:4px; min-width:60px;}

table.wikitable tr.compact-last > td{border-bottom:2px solid var(--accent);}

table.wikitable tr.station-separator > td{
  padding: 14px 16px !important; font-weight: 800; font-size: 16px; letter-spacing: .02em;
  line-height: 1.3; white-space: normal; word-break: break-word; text-align: left;
  vertical-align: middle; cursor: pointer;
  border-top: 3px solid var(--sep1-bd) !important;
  border-bottom: 3px solid var(--sep1-bd) !important;}
table.wikitable tr.station-separator:hover > td{filter: brightness(1.12);}
table.wikitable tr.station-separator .sep-num{display: inline-block; min-width: 2.6em;
  margin-right: 8px; padding: 2px 8px; border-radius: 6px; background: rgba(0,0,0,.18);
  font-variant-numeric: tabular-nums; font-weight: 800;}
html[data-theme="light"] table.wikitable tr.station-separator .sep-num{background: rgba(255,255,255,.6);}
table.wikitable tr.station-separator .sep-name{font-size: 16px;}
table.wikitable tr.station-separator .sep-freq{display: inline-block; margin-left: 10px;
  font-size: 13px; font-weight: 600; opacity: .8;}

table.wikitable tr.station-separator.sep-c1 > td{ background: var(--sep1-bg); color: var(--sep1-fg); border-top-color: var(--sep1-bd) !important; border-bottom-color: var(--sep1-bd) !important; }
table.wikitable tr.station-separator.sep-c2 > td{ background: var(--sep2-bg); color: var(--sep2-fg); border-top-color: var(--sep2-bd) !important; border-bottom-color: var(--sep2-bd) !important; }
table.wikitable tr.station-separator.sep-c3 > td{ background: var(--sep3-bg); color: var(--sep3-fg); border-top-color: var(--sep3-bd) !important; border-bottom-color: var(--sep3-bd) !important; }
table.wikitable tr.station-separator.sep-c4 > td{ background: var(--sep4-bg); color: var(--sep4-fg); border-top-color: var(--sep4-bd) !important; border-bottom-color: var(--sep4-bd) !important; }
table.wikitable tr.station-separator.sep-c5 > td{ background: var(--sep5-bg); color: var(--sep5-fg); border-top-color: var(--sep5-bd) !important; border-bottom-color: var(--sep5-bd) !important; }
table.wikitable tr.station-separator.sep-c6 > td{ background: var(--sep6-bg); color: var(--sep6-fg); border-top-color: var(--sep6-bd) !important; border-bottom-color: var(--sep6-bd) !important; }

table.wikitable tr.compact-aff > td:last-child{font-size: 12.5px;}

table.wikitable .call-cell strong{ cursor:pointer; }
table.wikitable .call-cell strong:hover{ color:var(--accent); text-decoration:underline; }

.pager{display:flex; gap:8px; align-items:center; justify-content:center;
  margin:14px 0 4px; flex-wrap:wrap;}
.pager button{padding:8px 14px;font-size:14px}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager .page-info{font-size:14px;color:var(--muted)}
.pager .page-info b{color:var(--text)}

.empty{text-align:center; color:var(--muted); padding:30px; font-style:italic;}

.modal-bg{position:fixed;inset:0;background:var(--shadow);display:none;
  align-items:center;justify-content:center;padding:12px;z-index:50;}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:16px;width:100%;max-width:520px;max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch;}
.modal h2{margin:0 0 12px;font-size:16px}
.field{margin-bottom:10px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field textarea{width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;}
.field textarea{resize:vertical;min-height:60px}
#f-info{ min-height:80px; }
#f-aff{ min-height:110px; }

.modal-actions{display:flex;gap:10px;margin-top:14px;}
.modal-actions button{
  flex:1 1 0;
  width:50%;
  padding:10px 12px;
  font-size:15px;
  font-weight:600;
  border-radius:8px;
  letter-spacing:.02em;
}
.modal-actions #btn-save{background:var(--accent); color:#fff; border-color:var(--accent);}
.modal-actions #btn-save:hover{filter:brightness(1.08);}
.modal-actions #btn-cancel:hover{border-color:var(--red); color:var(--red);}

.checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.checkbox-row input[type=checkbox]{width:auto;margin:0}
.checkbox-row label{margin:0;color:var(--text);font-size:14px}

.dyn-row{display:flex; gap:6px; align-items:center; margin-bottom:6px;}
.dyn-row .dyn-num{flex:0 0 auto; font-size:12px; color:var(--muted);
  min-width:1.9em; text-align:right; font-variant-numeric:tabular-nums;}
.dyn-row input{flex:1 1 auto; min-width:0; padding:8px;border-radius:8px;
  border:1px solid var(--border); background:var(--bg); color:var(--text);
  font-size:14px; font-family:inherit;}
.dyn-row .rm-btn{flex:0 0 auto; background:transparent; border:1px solid var(--border);
  color:var(--muted); border-radius:6px; width:30px; height:30px; padding:0;
  cursor:pointer; font-size:16px; line-height:1; display:inline-flex;
  align-items:center; justify-content:center;}
.dyn-row .rm-btn:hover{color:var(--red); border-color:var(--red);}
.btn-add-more{background:var(--panel2); color:var(--accent);
  border:1px dashed var(--accent); border-radius:8px; padding:8px 12px;
  width:100%; font-size:14px; cursor:pointer; margin-top:2px;}
.btn-add-more:hover{background:rgba(77,163,255,.12);}

#toast-single{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  z-index:9999; background:rgba(30,34,42,.94); color:#f0f4fa; padding:12px 20px;
  border-radius:22px; font-size:14px; line-height:1.35; box-shadow:0 4px 18px rgba(0,0,0,.45);
  backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.08); opacity:0;
  pointer-events:none; text-align:center; word-break:break-word; max-width:90vw;
  transition:opacity .25s ease, transform .25s ease;}
html[data-theme="light"] #toast-single{background:rgba(40,44,52,.94); color:#f6f8fb; border-color:rgba(0,0,0,.12);}
#toast-single.show{opacity:1; transform:translateX(-50%) translateY(0);}
#toast-single.toast-warn{background:rgba(202,138,4,.94); color:#111;}
#toast-single.toast-error{background:rgba(220,38,38,.94); color:#fff;}
#toast-single.toast-success{background:rgba(22,163,74,.94); color:#fff;}

#geo-block-notice{
  position:fixed; bottom:76px; left:50%; transform:translateX(-50%) translateY(20px);
  z-index:9998;
  background:rgba(230,232,236,.97); color:#1a1f29;
  padding:16px 28px;
  border-radius:14px;
  font-size:15px; line-height:1.4;
  box-shadow:0 6px 24px rgba(0,0,0,.28);
  backdrop-filter:blur(10px);
  border:1px solid rgba(0,0,0,.15);
  opacity:0;
  pointer-events:none; text-align:center;
  min-width:min(560px, 92vw);
  max-width:94vw;
  word-break:break-word;
  transition:opacity .3s ease, transform .3s ease;
  font-weight:700;
  letter-spacing:.01em;
}
html[data-theme="dark"] #geo-block-notice,
html:not([data-theme="light"]) #geo-block-notice{
  background:rgba(180,30,30,.96);
  color:#fde047;
  border:1px solid rgba(253,224,71,.45);
  box-shadow:0 6px 24px rgba(120,10,10,.5);
}

function sortStations(list){

/* ---------- TOAST ---------- */
var toastEl = el('toast-single');
var toastTimer = null, toastFadeTimer = null;
var TOAST_FADE_MS = 300;
var toastQueue = [];
var toastActive = false;
var toastOnDrainCallback = null;
var TOAST_DEFAULT_MS = 1800;

function showToast(message, type, duration){
  if(!toastEl) return;
  toastQueue.push({message:message, type:type, duration:duration});
  if(!toastActive) processToastQueue();
}

function processToastQueue(){
  if(!toastEl) return;
  if(toastQueue.length === 0){
    toastActive = false;
    if(toastOnDrainCallback){
      var cb = toastOnDrainCallback;
      toastOnDrainCallback = null;
      cb();
    }
    return;
  }
  toastActive = true;
  var job = toastQueue.shift();
  if(toastTimer){ clearTimeout(toastTimer); toastTimer=null; }
  if(toastFadeTimer){ clearTimeout(toastFadeTimer); toastFadeTimer=null; }

  toastEl.textContent = job.message;
  toastEl.className = 'toast' + (job.type ? ' toast-' + job.type : '');
  void toastEl.offsetWidth;
  toastEl.classList.add('show');

  var ms = job.duration || TOAST_DEFAULT_MS;
  toastTimer = setTimeout(function(){
    toastEl.classList.remove('show');
    toastFadeTimer = setTimeout(function(){
      if(!toastEl.classList.contains('show')) toastEl.textContent='';
      processToastQueue();
    }, TOAST_FADE_MS);
  }, ms);
}

function whenToastsDrained(callback){
  if(!toastActive && toastQueue.length === 0){
    callback();
    return;
  }
  toastOnDrainCallback = callback;
}

window.__showToast = showToast;
window.__whenToastsDrained = whenToastsDrained;

/* ---------- GEO-BLOCK NOTIFICATION ---------- */
var geoBlockEl = el('geo-block-notice');
var geoBlockTimer = null;
var geoBlockFadeTimer = null;
var GEO_BLOCK_MS = 5000;
var GEO_BLOCK_FADE_MS = 300;

function showGeoBlockNoticeNow(){
  if(!geoBlockEl) return;
  if(geoBlockTimer){ clearTimeout(geoBlockTimer); geoBlockTimer=null; }
  if(geoBlockFadeTimer){ clearTimeout(geoBlockFadeTimer); geoBlockFadeTimer=null; }
  geoBlockEl.textContent = '🚫 Geo-blocked/Blacked-out During Game Broadcasts!';
  geoBlockEl.classList.add('show');
  geoBlockTimer = setTimeout(function(){
    geoBlockEl.classList.remove('show');
    geoBlockFadeTimer = setTimeout(function(){
      if(!geoBlockEl.classList.contains('show')) geoBlockEl.textContent='';
    }, GEO_BLOCK_FADE_MS);
  }, GEO_BLOCK_MS);
}

function showGeoBlockNotice(){
  whenToastsDrained(function(){
    showGeoBlockNoticeNow();
  });
}
window.__showGeoBlockNotice = showGeoBlockNotice;

function detectType(url){
  var u=(url||'').toLowerCase().split('?')[0];
  if(u.endsWith('.m3u8')) return 'HLS (m3u8)';
  if(u.endsWith('.mpd')) return 'DASH';
  if(u.endsWith('.m3u')) return 'M3U';
  if(u.endsWith('.aac')||u.endsWith('.aacp')) return 'AAC';
  if(u.endsWith('.mp3')) return 'MP3';
  if(u.endsWith('.ogg')||u.endsWith('.oga')) return 'OGG';
  if(u.endsWith('.opus')) return 'OPUS';
  if(u.endsWith('.flac')) return 'FLAC';
  if(u.endsWith('.wav')) return 'WAV';
  if(u.indexOf('pls')!==-1) return 'PLS';
  return 'Stream';
}

var DEFAULT_LOGO_CACHE=null;
function defaultLogo(){
  if(DEFAULT_LOGO_CACHE) return DEFAULT_LOGO_CACHE;
  try{
    var c=document.createElement('canvas'); c.width=440; c.height=200;
    var ctx=c.getContext('2d');
    ctx.fillStyle='#1b2029'; ctx.fillRect(0,0,440,200);
    ctx.fillStyle='#4da3ff'; ctx.font='bold 48px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('RADIO',220,100);
    DEFAULT_LOGO_CACHE=c.toDataURL('image/png');
  }catch(e){
    DEFAULT_LOGO_CACHE='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==';
  }
  return DEFAULT_LOGO_CACHE;
}

function sanitizeImageUrl(raw){
  var v=String(raw==null?'':raw).trim(); if(!v) return '';
  var lower=v.toLowerCase();
  if(lower.indexOf('data:image/')===0){
    v=v.replace(/\s+/g,'');
    if(lower.indexOf('data:image/svg')===0){
      v=v.replace(/%(?![0-9A-Fa-f]{2})/g,'%25');
      v=v.replace(/#(?!.*?%23)/g,'%23');
    }
    return v;
  }
  if(/^https?:\/\//i.test(v)) return v;
  if(v.indexOf('//')===0) return 'https:'+v;
  try{ return new URL(v, window.location.href).href; }catch(e){ return ''; }
}

var P = {

/* ---------- CONCURRENCY-LIMITED STREAM PROBE ---------- */
var statusCache=new Map(), STATUS_TTL=60000;
var probeQueue=[], probeActive=0, PROBE_MAX=3;

function checkStreamOnline(url){
  return new Promise(function(resolve){
    if(!url) return resolve(false);
    var cached=statusCache.get(url);
    if(cached && Date.now()-cached.ts<STATUS_TTL) return resolve(cached.online);
    probeQueue.push({url:url, resolve:resolve});
    drainProbeQueue();
  });
}
function drainProbeQueue(){
  while(probeActive < PROBE_MAX && probeQueue.length){
    var job=probeQueue.shift();
    probeActive++;
    runProbe(job.url).then(function(online){
      statusCache.set(job.url,{online:online, ts:Date.now()});
      job.resolve(online);
    }).catch(function(){
      statusCache.set(job.url,{online:false, ts:Date.now()});
      job.resolve(false);
    }).then(function(){
      probeActive--;
      drainProbeQueue();
    });
  }
}
function runProbe(url){
  return new Promise(function(resolve){
    var settled=false;
    function finish(v){ if(settled) return; settled=true; resolve(v); }
    var a=document.createElement('audio');
    a.preload='none'; a.muted=true;
    var timer=setTimeout(tryFetch,5000);
    function cleanup(){
      clearTimeout(timer);
      try{ a.removeAttribute('src'); if(a.load) a.load(); }catch(e){}
    }
    a.addEventListener('canplay',function(){ cleanup(); finish(true); },{once:true});
    a.addEventListener('loadedmetadata',function(){ cleanup(); finish(true); },{once:true});
    a.addEventListener('error',function(){ cleanup(); tryFetch(); },{once:true});
    try{ a.src=url; a.load(); }catch(e){ tryFetch(); }
    function tryFetch(){
      fetch(url,{method:'GET',mode:'no-cors',cache:'no-store'})
        .then(function(){ finish(true); })
        .catch(function(){ finish(false); });
    }
  });
}

/* ---------- STREAM URL RESOLVER ---------- */

var resolveCache = new Map();

function isPlaylistText(text){
  var t = (text || '').trim();
  if(!t) return false;
  var low = t.toLowerCase();
  if(low.indexOf('[playlist]') !== -1) return true;
  if(low.indexOf('#extm3u') !== -1) return true;
  if(/^\s*file\d+\s*=/im.test(t)) return true;
  var lines = t.split(/\r?\n/).filter(function(l){ return l.trim() && l.trim().charAt(0)!=='#'; });
  if(lines.length && lines.every(function(l){ return /^https?:\/\//i.test(l.trim()); })){
    return true;
  }
  return false;
}

function extractStreamFromPlaylist(text, baseUrl){
  var t = String(text || '');
  var lines = t.split(/\r?\n/);
  var candidates = [];
  for(var i=0;i<lines.length;i++){
    var m = lines[i].match(/^\s*File\d+\s*=\s*(.+)$/i);
    if(m) candidates.push(m[1].trim());
  }
  if(!candidates.length){
    for(var j=0;j<lines.length;j++){
      var ln = lines[j].trim();
      if(!ln || ln.charAt(0) === '#') continue;
      if(/^https?:\/\//i.test(ln)){ candidates.push(ln); break; }
    }
  }
  if(!candidates.length) return null;
  var pick = candidates[0];
  try{ return new URL(pick, baseUrl).href; }catch(e){ return pick; }
}

function looksLikeAudioContentType(ct){
  ct = (ct || '').toLowerCase();
  return ct.indexOf('audio/') === 0 ||
         ct.indexOf('application/ogg') === 0 ||
         ct.indexOf('application/vnd.apple.mpegurl') === 0 ||
         ct.indexOf('application/x-mpegurl') === 0 ||
         ct.indexOf('application/dash+xml') === 0 ||
         ct.indexOf('video/mp2t') === 0 ||
         ct.indexOf('application/octet-stream') === 0;
}

function fetchResolved(url, proxyFn){
  var target = proxyFn ? proxyFn(url) : url;
  var ctrl = new AbortController();
  var to = setTimeout(function(){ try{ ctrl.abort(); }catch(e){} }, 6000);
  return fetch(target, {
    method: 'GET',
    redirect: 'follow',
    signal: ctrl.signal,
    cache: 'no-store',
    headers: { 'Icy-MetaData': '1' }
  }).then(function(res){
    clearTimeout(to);
    var ct = (res.headers.get('content-type') || '').toLowerCase();
    var finalUrl = res.url || url;

    if(looksLikeAudioContentType(ct)){
      try{ res.body && res.body.cancel && res.body.cancel(); }catch(e){}
      return finalUrl;
    }

    var reader = res.body && res.body.getReader ? res.body.getReader() : null;
    if(!reader) return finalUrl;

    return reader.read().then(function(r){
      try{ reader.cancel(); }catch(e){}
      if(r.done || !r.value) return finalUrl;
      var txt = new TextDecoder('latin1').decode(r.value.slice(0, 4096));
      if(isPlaylistText(txt)){
        var s = extractStreamFromPlaylist(txt, finalUrl);
        return s || finalUrl;
      }
      return finalUrl;
    });
  }).catch(function(err){
    clearTimeout(to);
    throw err;
  });
}

function preferHttpsVariant(url){
  if(!PAGE_IS_HTTPS) return url;
  if(!/^http:\/\//i.test(url)) return url;
  if(isKnownHttpOnly(url)) return url;             // don't rewrite known HTTP-only hosts
  return url.replace(/^http:/i, 'https:');
}

function resolveStreamUrl(url){
  if(!url) return Promise.resolve(null);

  url = stripStaleParams(url);

  var cached = resolveCache.get(url);
  if(cached && Date.now() - cached.ts < RESOLVE_TTL){
    return Promise.resolve(cached.direct);
  }

  var attempts = [];
  var httpsUrl = preferHttpsVariant(url);

  function pushAttempt(u, proxyFn){
    if(!u) return;
    attempts.push(function(){ return fetchResolved(u, proxyFn); });
  }

  pushAttempt(url, null);
  if(httpsUrl !== url) pushAttempt(httpsUrl, null);

  CORS_PROXIES.forEach(function(proxy){
    pushAttempt(url, proxy);
    if(httpsUrl !== url) pushAttempt(httpsUrl, proxy);
  });

  var chain = Promise.resolve(null);
  attempts.forEach(function(fn){
    chain = chain.then(function(direct){
      if(direct) return direct;
      return fn().catch(function(){ return null; });
    });
  });

  return chain.then(function(direct){
    direct = direct || url;
    resolveCache.set(url, { direct: direct, ts: Date.now() });
    return direct;
  });
}

/* ---------- ICY METADATA ---------- */
var META_REFRESH_MS=15000;
var metaTimer=null, metaAbort=null, currentMetaUrl=null;
var metaFallbackTimer=null, metaGotTitle=false;

var nowAlternateTimer=null;
var nowAlternatePhase=0;
var nowStationNameForAlt=null;
var nowHasIcy=false;

var icyMetaintCache = new Map();

function renderNowPlaying(title){
  if(!P.now) return;
  if(title){
    P.now.innerHTML = '<span class="np-label">Now Playing:</span> <span class="np-title">'+esc(title)+'</span>';
  }else{
    P.now.innerHTML = '<span class="np-label">Now Playing:</span> <span class="np-none">No Information Available</span>';
  }
}
function renderNowPlayingStation(stationName){
  if(!P.now) return;
  P.now.innerHTML = '<span class="np-label">Now Playing:</span> <span class="np-title">'+esc(stationName || 'No Information Available')+'</span>';
}

function stopAlternatingNowPlaying(){
  if(nowAlternateTimer){ clearInterval(nowAlternateTimer); nowAlternateTimer=null; }
  nowAlternatePhase=0;
}

function startAlternatingNowPlaying(stationName){
  stopAlternatingNowPlaying();
  nowStationNameForAlt = stationName || '';
  nowHasIcy = false;
  renderNowPlayingStation(nowStationNameForAlt);
  nowAlternatePhase = 0;
  nowAlternateTimer = setInterval(function(){
    if(nowHasIcy) return;
    nowAlternatePhase = nowAlternatePhase === 0 ? 1 : 0;
    if(nowAlternatePhase === 0){
      renderNowPlayingStation(nowStationNameForAlt);
    }else{
      renderNowPlaying(null);
    }
  }, 6000);
}

function markIcyAvailable(title){
  nowHasIcy = true;
  stopAlternatingNowPlaying();
  renderNowPlaying(title);
}

function clearFallbackTimer(){
  if(metaFallbackTimer){ clearTimeout(metaFallbackTimer); metaFallbackTimer=null; }
}
function stopIcyMeta(){
  if(metaTimer){ clearTimeout(metaTimer); metaTimer=null; }
  if(metaAbort){ try{ metaAbort.abort(); }catch(e){} metaAbort=null; }
  clearFallbackTimer();
  stopAlternatingNowPlaying();
  currentMetaUrl=null; metaGotTitle=false; nowHasIcy=false;
  nowStationNameForAlt=null;
  if(P.now) P.now.innerHTML='';
}
function startIcyMeta(url, stationName){
  stopIcyMeta(); if(!url) return;
  currentMetaUrl=url; metaGotTitle=false;
  startAlternatingNowPlaying(stationName);

  metaFallbackTimer=setTimeout(function(){
    if(currentMetaUrl!==url) return;
    if(!metaGotTitle && !nowHasIcy){
      if(!nowAlternateTimer) startAlternatingNowPlaying(stationName);
    }
  }, 5000);

  pollIcyOnce(url); scheduleNext(url);
}
function scheduleNext(url){
  if(currentMetaUrl!==url) return;
  metaTimer=setTimeout(function(){
    if(currentMetaUrl!==url) return;
    pollIcyOnce(url); scheduleNext(url);
  }, META_REFRESH_MS);
}
function pollIcyOnce(url){
  var t=detectType(url);
  if(t.indexOf('HLS')===0 || t==='DASH'){
    if(!nowAlternateTimer) startAlternatingNowPlaying(nowStationNameForAlt || P.name.textContent);
    return;
  }
  var i=0;
  function tryNext(){
    if(i>=CORS_PROXIES.length) return;
    var proxy=CORS_PROXIES[i++];
    fetchIcyTitle(proxy(url), url).then(function(title){
      if(title!==undefined && title!==null && title!==''){
        if(currentMetaUrl===url){
          metaGotTitle=true;
          clearFallbackTimer();
          markIcyAvailable(title);
        }
        return;
      }
      tryNext();
    });
  }
  tryNext();
}
function fetchIcyTitle(proxiedUrl, originalUrl){
  return new Promise(function(resolve){
    metaAbort=new AbortController();
    var signal=metaAbort.signal, reader=null;
    fetch(proxiedUrl,{method:'GET',headers:{'Icy-MetaData':'1'},signal:signal,cache:'no-store'})
    .then(function(res){
      if(!res.ok || !res.body) return resolve(undefined);
      reader=res.body.getReader();
      var chunks=[], received=0;
      var knownMetaInt = icyMetaintCache.get(originalUrl) || 0;
      var maxBytes = knownMetaInt ? (knownMetaInt + 4096) : 32768;
      function readLoop(){
        if(received>=maxBytes){
          var parsed=tryParseIcy(chunks, originalUrl);
          if(reader){ try{ reader.cancel(); }catch(e){} }
          return resolve(parsed===null?'':parsed);
        }
        reader.read().then(function(r){
          if(r.done){
            var parsed=tryParseIcy(chunks, originalUrl);
            if(reader){ try{ reader.cancel(); }catch(e){} }
            return resolve(parsed===null?'':parsed);
          }
          chunks.push(r.value); received+=r.value.length;
          var parsed=tryParseIcy(chunks, originalUrl);
          if(parsed!==null){ try{ reader.cancel(); }catch(e){} return resolve(parsed); }
          readLoop();
        }).catch(function(){ resolve(undefined); });
      }
      readLoop();
    }).catch(function(){ resolve(undefined); });
  });
}
function tryParseIcy(chunks, originalUrl){
  if(!chunks.length) return null;
  var total=0; for(var i=0;i<chunks.length;i++) total+=chunks[i].length;
  var buf=new Uint8Array(total), off=0;
  for(var j=0;j<chunks.length;j++){ buf.set(chunks[j],off); off+=chunks[j].length; }
  var headerEnd=-1;
  for(var k=0;k<buf.length-3;k++){
    if(buf[k]===13 && buf[k+1]===10 && buf[k+2]===13 && buf[k+3]===10){ headerEnd=k+4; break; }
  }
  if(headerEnd<0) return null;
  var headerText=new TextDecoder('latin1').decode(buf.slice(0,headerEnd));
  var m=headerText.match(/icy-metaint:\s*(\d+)/i);
  if(!m) return '';
  var metaint=parseInt(m[1],10);
  if(!metaint) return '';
  if(originalUrl) icyMetaintCache.set(originalUrl, metaint);
  var metaStart=headerEnd+metaint;
  if(buf.length<=metaStart) return null;
  var lenByte=buf[metaStart], metaLen=lenByte*16;
  if(metaLen===0) return '';
  if(buf.length<metaStart+1+metaLen) return null;
  var metaBlock=buf.slice(metaStart+1,metaStart+1+metaLen);
  var metaText=new TextDecoder('utf-8').decode(metaBlock).replace(/\0+$/g,'');
  var tm=metaText.match(/StreamTitle='([^']*)'/i);
  if(tm && tm[1]) return tm[1].trim();
  return '';
}

/* ============================================================
   MEDIA SESSION API
   ============================================================ */
function updateMediaSession(station){
  if(!('mediaSession' in navigator)) return;
  try{
    var art = [];
    var imgUrl = sanitizeImageUrl(station.img || '');
    if(imgUrl){
      art.push({ src: imgUrl, sizes: '512x512', type: 'image/png' });
    }
    navigator.mediaSession.metadata = new MediaMetadata({
      title: station.call || 'Radio Stream',
      artist: station.brand || station.freq || '',
      album: station.loc || '',
      artwork: art
    });
    navigator.mediaSession.setActionHandler('play', function(){
      try{ P.audio.play(); }catch(e){}
    });
    navigator.mediaSession.setActionHandler('pause', function(){
      try{ P.audio.pause(); }catch(e){}
    });
    navigator.mediaSession.setActionHandler('stop', function(){
      try{ P.audio.pause(); P.audio.currentTime = 0; }catch(e){}
    });
  }catch(e){ console.warn('MediaSession error:', e); }
}

/* ============================================================
   8-HOUR AUTO-RECOVERY
   ============================================================ */
var AUTO_RECOVERY_MS = 8 * 60 * 60 * 1000;
var autoRecoveryTimer = null;
var lastPlayStartTime = 0;

function scheduleAutoRecovery(){
  if(autoRecoveryTimer){ clearTimeout(autoRecoveryTimer); autoRecoveryTimer=null; }
  if(!lastPlayStartTime) return;
  var elapsed = Date.now() - lastPlayStartTime;
  var remaining = AUTO_RECOVERY_MS - (elapsed % AUTO_RECOVERY_MS);
  autoRecoveryTimer = setTimeout(performAutoRecovery, remaining);
}

function performAutoRecovery(){
  if(!CURRENT_ID){ scheduleAutoRecovery(); return; }
  var st = DB.find(function(s){ return s.id === CURRENT_ID; });
  if(!st){ scheduleAutoRecovery(); return; }
  var wasPlaying = !P.audio.paused;
  if(!wasPlaying){ scheduleAutoRecovery(); return; }

  console.info('[auto-recovery] 8h elapsed — flushing buffer and reconnecting');

  try{
    P.audio.pause();
    P.audio.removeAttribute('src');
    P.audio.load();
    setTimeout(function(){
      var urls = (st.urls || []).filter(Boolean).map(stripStaleParams);
      if(!urls.length){ scheduleAutoRecovery(); return; }
      stopIcyMeta();
      var idx = urls.indexOf(activeStreamUrl);
      if(idx < 0) idx = 0;
      tryPlayUrls(urls, st.call || 'Radio Stream', idx);
      lastPlayStartTime = Date.now();
      scheduleAutoRecovery();
      showToast('Auto-recovery: stream flushed and reconnected', 'success', 2500);
    }, 500);
  }catch(e){
    console.warn('[auto-recovery] failed:', e);
    scheduleAutoRecovery();
  }
}

/* ---------- PLAYBACK ---------- */
var hlsInstance=null, activeStreamUrl=null;

function setPlayerLink(a,url,label){
  if(url){
    a.href=url; a.textContent=label; a.classList.remove('missing');
    a.removeAttribute('aria-disabled'); a.style.pointerEvents='';
  }else{
    a.href='#'; a.textContent=label; a.classList.add('missing');
    a.setAttribute('aria-disabled','true'); a.style.pointerEvents='none';
  }
}
function renderStreamButtons(urls){
  P.streams.innerHTML='';
  urls.forEach(function(u,i){
    var b=document.createElement('button');
    b.type='button'; b.dataset.url=u;
    b.textContent = (i+1) + '. ' + detectType(u);
    b.title = u;
    if(u===activeStreamUrl) b.classList.add('active');
    P.streams.appendChild(b);
  });
}
function stopAudio(){
  try{ P.audio.pause(); }catch(e){}
  if(hlsInstance){ try{ hlsInstance.destroy(); }catch(e){} hlsInstance=null; }
  if(autoRecoveryTimer){ clearTimeout(autoRecoveryTimer); autoRecoveryTimer=null; }
  lastPlayStartTime = 0;
}
function loadScript(src){
  return new Promise(function(res,rej){
    var s=document.createElement('script');
    s.src=src; s.onload=res; s.onerror=rej;
    document.head.appendChild(s);
  });
}
function attachHLS(url){
  var canNative=P.audio.canPlayType('application/vnd.apple.mpegurl');
  if(canNative){ P.audio.src=url; return; }
  if(!window.Hls){
    loadScript('https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js')
      .catch(function(){}).then(function(){ attachHLS(url); });
    return;
  }
  if(window.Hls && window.Hls.isSupported()){
    hlsInstance=new window.Hls({lowLatencyMode:true});
    hlsInstance.loadSource(url); hlsInstance.attachMedia(P.audio);
    hlsInstance.on(window.Hls.Events.ERROR,function(_,data){
      if(data && data.fatal) console.warn('HLS fatal error',data);
    });
  }
}

var playAttemptToken = 0;

var INTER_ATTEMPT_DELAY_MS = 400;
var PER_STREAM_TIMEOUT_MS   = 7000;
var SWEEP_BUDGET_MS         = 25000;

function tryPlayUrls(urls, stationName, startIndex){
  var token = ++playAttemptToken;
  var index = startIndex || 0;
  var total = urls ? urls.length : 0;
  var sweepStart = Date.now();

  if(urls){
    urls = urls.map(stripStaleParams);
  }

  if(!urls || !total){
    P.status.textContent='No streams';
    P.status.className='badge offline';
    P.now.innerHTML = '<span class="np-label">Now Playing:</span> <span class="np-none">No stream URLs available</span>';
    showToast('This station has no stream URLs', 'error', 2500);
    return;
  }

  var failedNums = [];
  var startedIndex = index;

  attemptNext();

  function finishAllFailed(){
    if(token !== playAttemptToken) return;
    P.status.textContent='All streams failed';
    P.status.className='badge offline';
    P.now.innerHTML = '<span class="np-label">Now Playing:</span> <span class="np-none">Could not play any stream</span>';
    var noun = total > 1 ? 'Streams' : 'Stream';
    var msg;
    if(failedNums.length){
      msg = 'Could not Play ' + noun + ' ' + failedNums.join(', ') + '; All Streams Failed!';
    }else{
      msg = 'Could not Play ' + noun + ' 1-' + total + '; All Streams Failed!';
    }
    showToast(msg, 'error', 3000);
  }

  function attemptNext(){
    if(token !== playAttemptToken) return;

    if(Date.now() - sweepStart > SWEEP_BUDGET_MS){
      finishAllFailed();
      return;
    }

    if(index >= total){
      if(startedIndex > 0 && index >= total){
        var earlier = false;
        for(var k=0;k<startedIndex;k++){
          if(!failedNums.includes(k+1)){
            index = k;
            earlier = true;
            startedIndex = total;
            break;
          }
        }
        if(earlier){
          attemptNext();
          return;
        }
      }
      finishAllFailed();
      return;
    }

    var url = urls[index];
    activeStreamUrl = url;
    renderStreamButtons(urls);
    P.streams.querySelectorAll('button').forEach(function(b){
      b.classList.toggle('active', b.dataset.url === url);
    });
    var type = detectType(url);
    P.type.textContent = type + (total > 1 ? ' · ' + total + ' streams' : '');
    P.type.className = 'badge type';
    P.status.textContent = 'Resolving ' + (index+1) + ' / ' + total + '…';
    P.status.className = 'badge';

    checkStreamOnline(url).then(function(online){
      if(token !== playAttemptToken) return;
      if(index < total && urls[index] === url &&
         P.status.textContent.indexOf('Resolving') === 0){
        P.status.textContent = online ? 'Online' : 'Offline';
        P.status.className = 'badge ' + (online ? 'online' : 'offline');
      }
    });

    stopAudio(); stopIcyMeta();

    resolveStreamUrl(url).then(function(directUrl){
      if(token !== playAttemptToken) return;
      if(!directUrl){ onFail(); return; }

      var playUrl = directUrl;
      P.status.textContent = 'Trying ' + (index+1) + ' / ' + total + '…';
      P.status.className = 'badge';

      if(/\.m3u8(\?|$)/i.test(playUrl) || /mpegurl/i.test(playUrl)){
        attachHLS(playUrl);
        P.audio.src = playUrl;
      }else{
        P.audio.src = playUrl;
      }
      P.audio.load();

      var playCheckTimer = null;
      var settled = false;

      function onSuccess(){
        if(settled || token !== playAttemptToken) return;
        settled = true;
        cleanupListeners();

        if(playUrl !== url){
          resolveCache.set(url, { direct: playUrl, ts: Date.now() });
        }

        startIcyMeta(url, stationName);
        lastPlayStartTime = Date.now();
        scheduleAutoRecovery();

        var station = DB.find(function(s){ return s.id === CURRENT_ID; });
        if(station){
          updateMediaSession(station);
          if(station.geoblocked) showGeoBlockNotice();
        }

        var msg;
        if(failedNums.length === 0){
          msg = 'Playing Stream ' + (index+1) + ' of ' + total;
        }else{
          var failNoun = failedNums.length > 1 ? 'Streams' : 'Stream';
          msg = 'Could not Play ' + failNoun + ' ' + failedNums.join(', ') +
                '; Playing Stream ' + (index+1) + ' of ' + total;
        }
        showToast(msg, failedNums.length === 0 ? null : 'warn', 2500);
      }

      function onFail(){
        if(settled || token !== playAttemptToken) return;
        settled = true;
        cleanupListeners();
        console.warn('Stream ' + (index+1) + ' failed (resolved: ' + playUrl + ').');
        var num = index + 1;
        if(failedNums.indexOf(num) === -1) failedNums.push(num);
        index++;
        setTimeout(function(){
          if(token !== playAttemptToken) return;
          attemptNext();
        }, INTER_ATTEMPT_DELAY_MS);
      }

      function cleanupListeners(){
        if(playCheckTimer){ clearTimeout(playCheckTimer); playCheckTimer=null; }
        P.audio.removeEventListener('canplay', onSuccess);
        P.audio.removeEventListener('playing', onSuccess);
        P.audio.removeEventListener('error', onFail);
      }

      P.audio.addEventListener('canplay', onSuccess, {once:true});
      P.audio.addEventListener('playing', onSuccess, {once:true});
      P.audio.addEventListener('error', onFail, {once:true});

      var playPromise = P.audio.play();
      if(playPromise && playPromise.catch){
        playPromise.catch(function(err){
          console.warn('play() rejected for stream ' + (index+1)+':', err && err.name);
          onFail();
        });
      }

      playCheckTimer = setTimeout(function(){
        if(settled || token !== playAttemptToken) return;
        console.warn('Stream ' + (index+1) + ' timed out (resolved: ' + playUrl + ').');
        onFail();
      }, PER_STREAM_TIMEOUT_MS);
    }).catch(function(){
      if(token !== playAttemptToken) return;
      onFail();
    });
  }
}

P.streams.addEventListener('click',function(e){
  var b=e.target.closest('button');
  if(!b || !b.dataset.url) return;
  var st = DB.find(function(s){ return s.id === CURRENT_ID; }) || {};
  var urls = (st.urls || []).filter(Boolean).map(stripStaleParams);
  var idx = urls.indexOf(b.dataset.url);
  if(idx < 0) idx = 0;
  tryPlayUrls(urls, P.name.textContent, idx);
});
P.edit.addEventListener('click', function(){

});

  P.fav.hidden=false;
  P.fav.dataset.id=st.id;
  P.fav.textContent = st.fav ? '★' : '☆';
  P.fav.classList.toggle('on', !!st.fav);
}

function selectStation(id, autoPlayFirst){
  var st=DB.find(function(s){ return s.id===id; });
  if(!st) return;
  CURRENT_ID=id;
  try{ localStorage.setItem(LS_CURRENT,id); }catch(e){}
  P.name.textContent=st.call||'(no call letters)';
  renderSub({freq:st.freq, brand:st.brand, loc:st.loc, genre:st.genre});
  setPlayerImage(st.img, st.imgDark);
  setPlayerLink(P.web, st.web, 'Website');
  setPlayerLink(P.wiki, st.wiki, 'Wikipedia');
  setWebcastButtons([st.webcast, st.webcast2, st.webcast3]);
  P.edit.dataset.id = st.id;
  updateFavButton(st);
  var urls=(st.urls||[]).filter(Boolean);
  var primary=urls[0]||'';
  P.type.textContent=detectType(primary) + (urls.length > 1 ? ' · ' + urls.length + ' streams' : '');
  P.type.className='badge type';
  P.status.textContent='Checking…'; P.status.className='badge';
  checkStreamOnline(primary).then(function(online){
    if(P.status.textContent === 'Checking…'){
      P.status.textContent=online?'Online':'Offline';
      P.status.className='badge '+(online?'online':'offline');
    }
  });
  activeStreamUrl=null;
  renderStreamButtons(urls);
  stopAudio(); stopIcyMeta();
  try{ P.audio.removeAttribute('src'); P.audio.load(); }catch(e){}
  if(autoPlayFirst && urls.length) tryPlayUrls(urls, P.name.textContent, 0);
}

function resetPlayer(){
  CURRENT_ID=null;
  try{ localStorage.removeItem(LS_CURRENT); }catch(e){}
  stopAudio(); stopIcyMeta();
  P.name.textContent='No station selected';
  P.sub.innerHTML='';
  P.now.innerHTML='';
  P.type.textContent='-'; P.type.className='badge';
  P.status.textContent='-'; P.status.className='badge';
  P.streams.innerHTML='';
  P.edit.dataset.id='';
  updateFavButton(null);
  setPlayerImage('', '');
  setPlayerLink(P.web,'','Website');
  setPlayerLink(P.wiki,'','Wikipedia');
  clearWebcastRows();
  if('mediaSession' in navigator){
    try{ navigator.mediaSession.metadata = null; }catch(e){}
  }
}

window.__RS = {

  el:el, uid:uid, esc:esc, applyTheme:applyTheme, saveDB:saveDB,

};

function updateSearchClearBtn(){
  if(searchInput.value.length > 0) searchClearBtn.classList.add('visible');
  else searchClearBtn.classList.remove('visible');
}
function updateFilterButtons(){
  favFilterBtn.classList.toggle('on', viewMode === 'favorites');
  favFilterBtn.textContent = (viewMode === 'favorites' ? '★' : '☆') + ' Favorites';
  allStationsBtn.classList.toggle('on', viewMode === 'all');
  allStationsBtn.textContent = '📻 Show All Stations';
}
updateFilterButtons();
updateSearchClearBtn();

favFilterBtn.addEventListener('click', function(){
  viewMode = (viewMode === 'favorites') ? 'none' : 'favorites';
  currentPage = 1; updateFilterButtons(); renderTable();
});
allStationsBtn.addEventListener('click', function(){
  viewMode = (viewMode === 'all') ? 'none' : 'all';
  currentPage = 1; updateFilterButtons(); renderTable();
});

var searchDebounce = null;
searchInput.addEventListener('input', function(e){
  updateSearchClearBtn();
  if(searchDebounce) clearTimeout(searchDebounce);
  searchDebounce = setTimeout(function(){
    searchTerm = e.target.value.trim();
    currentPage = 1;
    if(searchTerm) viewMode = 'search';
    else if(viewMode === 'search') viewMode = 'none';
    updateFilterButtons();
    renderTable();
  }, 200);
});

  if(searchDebounce){ clearTimeout(searchDebounce); searchDebounce=null; }
  searchInput.value=''; searchTerm=''; currentPage=1;
  if(viewMode === 'search') viewMode='none';
  updateSearchClearBtn(); updateFilterButtons(); renderTable();
  searchInput.focus();
});

pgNextTop.onclick = function(){ currentPage++; renderTable(); };
pgPrev.onclick = function(){ if(currentPage>1){ currentPage--; renderTable(); } };
pgNext.onclick = function(){ currentPage++; renderTable(); };

function getDB(){ return RS.DB(); }

function filteredSorted(){
  var list = getDB();
  if(viewMode === 'favorites' && !searchTerm){
    list = list.filter(function(s){ return !!s.fav; });
  }
  if(searchTerm){
    var t = searchTerm.toLowerCase();
    var base = (viewMode === 'favorites') ? list.filter(function(s){ return !!s.fav; }) : list;
    list = base.filter(function(st){
      var blob = [st.call,st.brand,st.freq,st.loc,st.genre,st.info,st.aff,st.web,st.wiki,st.webcast,st.webcast2,st.webcast3,(st.urls||[]).join(' '),(st.flags||[]).join(' ')]
        .join(' ').toLowerCase();
      return blob.indexOf(t) !== -1;
    });
  }
  return sortStations(list);
}

function makeHighlighter(term){
  if(!term) return function(text){ return esc(text); };
  var safe = term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  var re = new RegExp('('+safe+')','gi');
  return function(text){
    var s = String(text==null?'':text);
    if(!s) return '';
    var parts = s.split(re);
    var out = '';
    for(var i=0;i<parts.length;i++){
      if(i % 2 === 1) out += '<mark>'+esc(parts[i])+'</mark>';
      else out += esc(parts[i]);
    }
    return out;
  };
}

var SEP_COLOR_CLASSES = ['sep-c1','sep-c2','sep-c3','sep-c4','sep-c5','sep-c6'];
function sepColorClass(i){ return SEP_COLOR_CLASSES[i % SEP_COLOR_CLASSES.length]; }

function buildSeparatorRow(st, absoluteIndex, globalNumber){
  var colorClass = sepColorClass(absoluteIndex);
  var displayName = st.call || st.brand || st.freq || '(unnamed station)';
  var freqPart = st.freq ? ' <span class="sep-freq">' + esc(st.freq) + '</span>' : '';
  var numLabel = String(globalNumber).padStart(3, '0') + '.';
  return '<tr class="station-separator ' + colorClass + '" data-id="' + st.id + '" data-play-sep="' + st.id + '">' +
    '<td colspan="2">' +
      '<span class="sep-num">' + numLabel + '</span>' +
      '<span class="sep-name">' + esc(displayName) + '</span>' +
      freqPart +
    '</td></tr>';
}

function renderTable(){
  var dbTotal = getDB().length;
  var favTotal = getDB().filter(function(s){ return !!s.fav; }).length;
  var needsView = (viewMode !== 'none') || !!searchTerm;

  if(!needsView){
    searchInfo.innerHTML = '<b>'+dbTotal+'</b> station'+(dbTotal===1?'':'s')+' in database · ' +
      '<b>'+favTotal+'</b> favorite'+(favTotal===1?'':'s');
    tableWrap.classList.remove('visible');
    pager.style.display = 'none';
    pagerTop.style.display = 'none';
    tbody.innerHTML = '';
    return;
  }

  var list = filteredSorted();
  var total = list.length;
  var compactMode = !searchTerm && (viewMode === 'favorites' || viewMode === 'all');

  if(viewMode === 'favorites' && !searchTerm){
    searchInfo.innerHTML = '<b>'+total+'</b> favorite'+(total===1?'':'s')+' (compact view)';
  } else if(viewMode === 'all' && !searchTerm){
    searchInfo.innerHTML = '<b>'+total+'</b> station'+(total===1?'':'s')+' (compact view)';
  } else if(searchTerm && viewMode === 'favorites'){
    searchInfo.innerHTML = '<b>'+total+'</b> favorite result'+(total===1?'':'s')+
      ' for "<b>'+esc(searchTerm)+'</b>"';
  } else {
    searchInfo.innerHTML = '<b>'+total+'</b> result'+(total===1?'':'s')+
      ' for "<b>'+esc(searchTerm)+'</b>"';
  }

  tableWrap.classList.add('visible');

  if(!total){
    tbody.innerHTML = '<tr><td colspan="2" class="empty">'+
      (viewMode === 'favorites' ? 'No favorites yet. Tap a star ☆ to add one.' : 'No matches.')+
      '</td></tr>';
    pager.style.display = 'none';
    pagerTop.style.display = 'none';
    return;
  }

  var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(currentPage > totalPages) currentPage = totalPages;
  if(currentPage < 1) currentPage = 1;
  var start = (currentPage - 1) * PAGE_SIZE;
  var pageItems = list.slice(start, start + PAGE_SIZE);

  var hl = makeHighlighter(searchTerm);
  var htmlParts = [];

  pageItems.forEach(function(st, i){
    var absoluteIndex = start + i;
    var globalNumber = absoluteIndex + 1;

    var urls = (st.urls||[]).filter(Boolean);
    var urlsHtml = urls.length
      ? '<div class="url-list">'+urls.map(function(u){
          return '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+hl(u)+'</a>';
        }).join('')+'</div>'
      : '<span style="color:var(--muted)">—</span>';
    var webHtml = st.web ? '<a href="'+esc(st.web)+'" target="_blank" rel="noopener">'+hl(st.web)+'</a>'
      : '<span style="color:var(--muted)">—</span>';
    var wikiHtml = st.wiki ? '<a href="'+esc(st.wiki)+'" target="_blank" rel="noopener">'+hl(st.wiki)+'</a>'
      : '<span style="color:var(--muted)">—</span>';
    var webcastHtml = '';
    if(st.webcast) webcastHtml += '<a href="'+esc(st.webcast)+'" target="_blank" rel="noopener">'+hl(st.webcast)+'</a>';
    if(st.webcast2) webcastHtml += (webcastHtml ? '<br>' : '') + '<a href="'+esc(st.webcast2)+'" target="_blank" rel="noopener">'+hl(st.webcast2)+'</a>';
    if(st.webcast3) webcastHtml += (webcastHtml ? '<br>' : '') + '<a href="'+esc(st.webcast3)+'" target="_blank" rel="noopener">'+hl(st.webcast3)+'</a>';
    if(!webcastHtml) webcastHtml = '<span style="color:var(--muted)">—</span>';
    var infoHtml = st.info ? hl(st.info).replace(/\n/g,'<br>') : '<span style="color:var(--muted)">—</span>';
    var affHtml = st.aff ? hl(st.aff).replace(/\n/g,'<br>') : '<span style="color:var(--muted)">—</span>';
    var flagsHtml = (st.flags && st.flags.length)
      ? st.flags.map(function(f){ return hl(f); }).join('<br>')
      : '<span style="color:var(--muted)">—</span>';
    var starHtml = '<button class="fav-btn'+(st.fav?' on':'')+'" data-fav="'+st.id+
      '" title="Toggle favorite" aria-label="Toggle favorite">'+(st.fav?'★':'☆')+'</button>';

    htmlParts.push(buildSeparatorRow(st, absoluteIndex, globalNumber));

    if(compactMode){
      htmlParts.push('<tr class="station-group-start" data-id="'+st.id+'">'+
        '<td>Call letters</td>'+
        '<td><div class="call-cell" data-play-call="'+st.id+'" title="Tap station name to play">'+
          starHtml+
          '<span class="status-dot dot-unknown" data-dot="'+st.id+'"></span>'+
          '<strong>'+hl(st.call||'(no call letters)')+'</strong>'+
        '</div></td></tr>');
      htmlParts.push('<tr data-id="'+st.id+'"><td>Branding</td><td>'+hl(st.brand||'—')+'</td></tr>');
      htmlParts.push('<tr data-id="'+st.id+'"><td>Frequency</td><td><div class="freq-cell"><span class="freq-text">'+hl(st.freq||'—')+'</span></div></td></tr>');
      htmlParts.push('<tr data-id="'+st.id+'"><td>Location</td><td>'+hl(st.loc||'—')+'</td></tr>');
      htmlParts.push('<tr data-id="'+st.id+'"><td>Genre</td><td>'+hl(st.genre||'—')+'</td></tr>');
      htmlParts.push('<tr data-id="'+st.id+'" class="compact-aff"><td>Affiliations</td><td>'+affHtml+'</td></tr>');
      if(st.flags && st.flags.length){
        htmlParts.push('<tr data-id="'+st.id+'"><td>Additional Information</td><td>'+flagsHtml+'</td></tr>');
      }
      if(st.webcast || st.webcast2 || st.webcast3){
        htmlParts.push('<tr data-id="'+st.id+'"><td>Webcast</td><td>'+webcastHtml+'</td></tr>');
      }
      htmlParts.push('<tr data-id="'+st.id+'" class="compact-last"><td colspan="2" style="padding:0;border:none;height:2px;background:var(--accent)"></td></tr>');
      return;
    }

    htmlParts.push('<tr class="station-group-start" data-id="'+st.id+'">'+
      '<td>Call letters</td>'+
      '<td><div class="call-cell" data-play-call="'+st.id+'" title="Click to load this station">'+
        starHtml+
        '<span class="status-dot dot-unknown" data-dot="'+st.id+'"></span>'+
        '<strong>'+hl(st.call||'(no call letters)')+'</strong>'+
      '</div></td></tr>');
    htmlParts.push('<tr data-id="'+st.id+'"><td>Branding</td><td>'+hl(st.brand||'—')+'</td></tr>');
    htmlParts.push('<tr data-id="'+st.id+'"><td>Frequency</td><td><div class="freq-cell"><span class="freq-text">'+hl(st.freq||'—')+'</span></div></td></tr>');
    htmlParts.push('<tr data-id="'+st.id+'"><td>Location</td><td>'+hl(st.loc||'—')+'</td></tr>');
    htmlParts.push('<tr data-id="'+st.id+'"><td>Genre</td><td>'+hl(st.genre||'—')+'</td></tr>');
    htmlParts.push('<tr data-id="'+st.id+'"><td>Stream URL(s)</td><td>'+urlsHtml+'</td></tr>');
    htmlParts.push('<tr data-id="'+st.id+'"><td>Webcast</td><td>'+webcastHtml+'</td></tr>');
    htmlParts.push('<tr data-id="'+st.id+'"><td>Website</td><td>'+webHtml+'</td></tr>');
    htmlParts.push('<tr data-id="'+st.id+'"><td>Wikipedia</td><td>'+wikiHtml+'</td></tr>');
    htmlParts.push('<tr data-id="'+st.id+'"><td>Station information</td><td>'+infoHtml+'</td></tr>');
    htmlParts.push('<tr data-id="'+st.id+'"><td>Affiliations</td><td>'+affHtml+'</td></tr>');
    htmlParts.push('<tr data-id="'+st.id+'"><td>Additional Information</td><td>'+flagsHtml+'</td></tr>');
    htmlParts.push('<tr data-id="'+st.id+'"><td>Actions</td><td><div class="actions">'+
      '<button class="danger" data-del="'+st.id+'">Delete</button></div></td></tr>');
  });

  tbody.innerHTML = htmlParts.join('');

  var showPager = totalPages > 1;
  pager.style.display = showPager ? 'flex' : 'none';
  pagerTop.style.display = showPager ? 'flex' : 'none';

  var pagerHTML = 'Page <b>'+currentPage+'</b> of <b>'+totalPages+'</b> — '+total+' result'+(total===1?'':'s');
  pgInfo.innerHTML = pagerHTML;
  pgInfoTop.innerHTML = pagerHTML;

  pgPrev.disabled = currentPage <= 1;
  pgNext.disabled = currentPage >= totalPages;
  pgPrevTop.disabled = currentPage <= 1;
  pgNextTop.disabled = currentPage >= totalPages;

  pageItems.forEach(function(st){
    var first = (st.urls||[])[0]; if(!first) return;
    checkStreamOnline(first).then(function(ok){
      var dot = tbody.querySelector('[data-dot="'+st.id+'"]');
      if(dot) dot.className = 'status-dot ' + (ok?'dot-on':'dot-off');
    });
  });
}

function toggleFav(id){
  var db = getDB().slice();
  var st = db.find(function(s){ return s.id===id; });
  if(!st) return;
  st.fav = !st.fav;
  RS.setDB(db);
  if(!saveDB(db)){ st.fav = !st.fav; RS.setDB(db); return; }
  tbody.querySelectorAll('button[data-fav="'+id+'"]').forEach(function(b){
    b.textContent = st.fav ? '★' : '☆';
    b.classList.toggle('on', !!st.fav);
  });
  if(RS.getCurrentId() === id){
    var pf = el('p-fav');
    pf.textContent = st.fav ? '★' : '☆';
    pf.classList.toggle('on', !!st.fav);
  }
  if(viewMode === 'favorites') renderTable();
}
window.__toggleFav = toggleFav;

tbody.addEventListener('click', function(e){
  var favBtn = e.target.closest('button[data-fav]');
  if(favBtn){ e.stopPropagation(); toggleFav(favBtn.dataset.fav); return; }
  var sepRow = e.target.closest('tr.station-separator');
  if(sepRow && sepRow.dataset.playSep){
    e.stopPropagation(); selectStation(sepRow.dataset.playSep, true); return;
  }
  var callCell = e.target.closest('.call-cell');
  if(callCell && !e.target.closest('button[data-fav]')){
    selectStation(callCell.dataset.playCall, true); return;
  }
  var btn = e.target.closest('button'); if(!btn) return;
  if(btn.dataset.del) deleteStation(btn.dataset.del);
});

/* ==================== DYNAMIC ROWS ==================== */
function makeDynRow(kind, value){
  var row = document.createElement('div');
  row.className = 'dyn-row';

  var num = document.createElement('span');
  num.className = 'dyn-num';

  var input = document.createElement('input');
  input.type = 'text';
  input.className = kind === 'url' ? 'url-input' : 'flag-input';
  input.placeholder = kind === 'url' ? 'https://...' : 'Additional info…';
  input.value = value || '';

  var rm = document.createElement('button');
  rm.type = 'button';
  rm.className = 'rm-btn';
  rm.textContent = '×';
  rm.title = 'Remove';
  rm.setAttribute('aria-label', 'Remove');
  rm.onclick = function(){
    var container = row.parentNode;
    container.removeChild(row);
    renumberRows(container);
  };

  row.appendChild(num);
  row.appendChild(input);
  row.appendChild(rm);
  return row;
}

function renumberRows(container){
  if(!container) return;
  var rows = container.querySelectorAll('.dyn-row');
  rows.forEach(function(r, i){
    var n = r.querySelector('.dyn-num');
    if(n) n.textContent = (i+1) + '.';
    var rm = r.querySelector('.rm-btn');
    if(rm) rm.style.display = rows.length > 1 ? 'inline-flex' : 'none';
  });
}

function buildDynFields(container, kind, values, minCount){
  if(!container) return;
  container.innerHTML = '';
  var items = (values || []).filter(Boolean);
  var count = Math.max(minCount, items.length);
  for(var i=0;i<count;i++){
    container.appendChild(makeDynRow(kind, items[i] || ''));
  }
  renumberRows(container);
}

function collectDyn(container){
  var out = [];
  if(!container) return out;
  container.querySelectorAll('.dyn-row input').forEach(function(inp){
    var v = (inp.value || '').trim();
    if(v) out.push(v);
  });
  return out;
}

el('btn-add-url').addEventListener('click', function(){

});

  el('modal-title').textContent = id ? 'Edit station' : 'Add station';
  el('f-id').value = id || '';
  var st = id ? (getDB().find(function(s){ return s.id===id; }) || {}) : {};

  el('f-call').value = st.call||'';
  el('f-brand').value = st.brand||'';
  el('f-freq').value = st.freq||'';
  el('f-loc').value = st.loc||'';
  el('f-genre').value = st.genre||'';
  el('f-webcast1').value = st.webcast||'';
  el('f-webcast2').value = st.webcast2||'';
  el('f-webcast3').value = st.webcast3||'';
  el('f-web').value = st.web||'';
  el('f-wiki').value = st.wiki||'';
  el('f-img').value = st.img||'';
  el('f-img-dark').value = st.imgDark||'';
  el('f-info').value = st.info||'';
  el('f-aff').value = st.aff||'';
  el('f-fav').checked = !!st.fav;
  el('f-geoblocked').checked = !!st.geoblocked;

  buildDynFields(el('f-url-fields'), 'url', st.urls || [], 4);
  buildDynFields(el('f-flag-fields'), 'flag', st.flags || [], 2);

  modalBg.classList.add('open');
  setTimeout(function(){ el('f-call').focus(); },50);
}
window.__openModal = openModal;
function closeModal(){ modalBg.classList.remove('open'); }
el('btn-cancel').onclick = closeModal;
modalBg.addEventListener('click', function(e){ if(e.target===modalBg) closeModal(); });

function findDuplicate(call, urls, excludeId){
  var c = (call||'').trim().toLowerCase();
  var uSet = new Set((urls||[]).map(function(u){ return (u||'').trim().toLowerCase(); }).filter(Boolean));
  var db = getDB();
  for(var i=0;i<db.length;i++){
    var s = db[i]; if(excludeId && s.id===excludeId) continue;
    var sc = (s.call||'').trim().toLowerCase();
    if(c && sc && c===sc) return s;
    var su = (s.urls||[]).map(function(u){ return (u||'').trim().toLowerCase(); });
    for(var j=0;j<su.length;j++){ if(su[j] && uSet.has(su[j])) return s; }
  }
  return null;
}

el('btn-save').onclick = function(){
  var id = el('f-id').value;
  var st = {
    id: id || uid(),
    call: el('f-call').value.trim(),
    brand: el('f-brand').value.trim(),
    freq: el('f-freq').value.trim(),
    loc: el('f-loc').value.trim(),
    genre: el('f-genre').value.trim(),
    urls: collectDyn(el('f-url-fields')),
    flags: collectDyn(el('f-flag-fields')),
    webcast: el('f-webcast1').value.trim(),
    webcast2: el('f-webcast2').value.trim(),
    webcast3: el('f-webcast3').value.trim(),
    web: el('f-web').value.trim(),
    wiki: el('f-wiki').value.trim(),
    img: el('f-img').value.trim(),
    imgDark: el('f-img-dark').value.trim(),
    info: el('f-info').value.trim(),
    aff: el('f-aff').value.trim(),
    fav: el('f-fav').checked,
    geoblocked: el('f-geoblocked').checked
  };
  if(!st.call && !st.urls.length){ alert('Please enter at least a call letters or a stream URL.'); return; }
  if(!id){
    var dup = findDuplicate(st.call, st.urls, null);
    if(dup){
      var label = dup.call||dup.freq||dup.loc||'(unnamed station)';
      var proceed = confirm('A station that looks like this already exists:\n\n• '+label+(dup.freq?' — '+dup.freq:'')+'\n\nAdd it anyway?');
      if(!proceed) return;
    }
  }
  var db = getDB().slice();
  if(id){
    var i = db.findIndex(function(s){ return s.id===id; });
    if(i>=0) db[i] = st;
  } else db.push(st);
  db = sortStations(db);
  if(!saveDB(db)){ alert('Could not save — storage limit reached.'); return; }
  RS.setDB(db);
  renderTable();
  closeModal();
  if(!RS.getCurrentId() || RS.getCurrentId()===st.id) selectStation(st.id, false);
};

function deleteStation(id){
  var db = getDB(); var st = db.find(function(s){ return s.id===id; });
  if(!st) return;
  var label = st.call||st.freq||'this station';
  if(!confirm('Delete "'+label+'"?\n\nThis cannot be undone.')) return;
  var ndb = db.filter(function(s){ return s.id!==id; });
  if(!saveDB(ndb)){ alert('Could not save deletion — storage error.'); return; }
  RS.setDB(ndb);
  if(RS.getCurrentId()===id) resetPlayer();
  renderTable();
  alert('"'+label+'" was deleted.');
}

function clearAll(){
  var db = getDB();
  if(!db.length){ alert('The database is already empty.'); return; }
  if(!confirm('WARNING\n\nYou are about to delete ALL '+db.length+' station(s).\n\nThis cannot be undone.')) return;
  if(!confirm('Are you absolutely sure?\n\nAll '+db.length+' station(s) will be permanently deleted.')) return;
  if(!saveDB([])){ alert('Could not clear database — storage error.'); return; }
  RS.setDB([]);
  resetPlayer();
  currentPage = 1;
  renderTable();
  alert('All stations deleted.');
}

async function exportDB(){
  var data = {exportedAt:new Date().toISOString(), version:15, stations:getDB()};
  var jsonText = JSON.stringify(data, null, 2);
  var defaultName = 'radio-db-'+new Date().toISOString().slice(0,10)+'.json';

  if(window.showSaveFilePicker){
    try{
      var handle = await window.showSaveFilePicker({
        suggestedName: defaultName,
        types:[{description:'JSON file', accept:{'application/json':['.json']}}]
      });
      var writable = await handle.createWritable();
      await writable.write(jsonText);
      await writable.close();
      alert('Exported successfully to:\n'+handle.name);
      return;
    }catch(err){
      if(err && err.name==='AbortError') return;
      console.warn('File System Access API failed, falling back:', err);
    }
  }
  try{
    var blob = new Blob([jsonText], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = defaultName;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    alert('Export started. On Android the file is usually saved in your Downloads folder.');
  }catch(e){
    alert('Export failed: '+e.message);
  }
}

el('file-import').onchange = function(e){
  var file = e.target.files[0]; if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var parsed = JSON.parse(reader.result);
      var list = Array.isArray(parsed) ? parsed : (parsed.stations || []);
      if(!Array.isArray(list)) throw new Error('Invalid format');
      var db = getDB();
      var mode = db.length ? (confirm('Merge with existing database?\n\nOK = merge\nCancel = replace') ? 'merge' : 'replace') : 'replace';
      var clean = list.map(function(s){
        return {
          id: s.id || uid(),
          call: s.call || '', brand: s.brand || '', freq: s.freq || '', loc: s.loc || '',
          genre: s.genre || '',
          urls: Array.isArray(s.urls) ? s.urls.filter(Boolean) : (s.url ? [s.url] : []),
          flags: Array.isArray(s.flags) ? s.flags.filter(Boolean) : [],
          webcast: s.webcast || '', webcast2: s.webcast2 || '', webcast3: s.webcast3 || '',
          web: s.web || '', wiki: s.wiki || '', img: s.img || '', imgDark: s.imgDark || '',
          info: s.info || '', aff: s.aff || '', fav: !!s.fav, geoblocked: !!s.geoblocked
        };
      });
      if(mode === 'merge'){
        var existing = new Set(db.map(function(x){ return x.id; }));
        clean.forEach(function(c){ if(!existing.has(c.id)) db.push(c); });
      } else db = clean;
      db = sortStations(db);
      if(!saveDB(db)){ alert('Import succeeded in memory but could not be saved (storage limit). Export your data to keep it.'); }
      RS.setDB(db);
      currentPage = 1;
      renderTable();
      alert('Imported '+clean.length+' station(s).');
    }catch(err){
      alert('Import failed: '+err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
};

renderTable();
resetPlayer();
})();
</script>
